# Quality gates for LOOK UP. See docs/engineering/RELIABILITY.md.
#
# A green run proves the code installs, typechecks, passes the data-layer tests
# and bundles for Android and iOS. It does NOT prove the app runs on a phone:
# Expo Go on a physical device is still the acceptance gate (docs/DEMO.md).
name: CI

on:
  push:
    branches: [main, "qa/**", "upgrade/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches docs/ARCHITECTURE.md
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck (whole app, incl. screens)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (store, privacy filter, seed, note, time)
        run: npm run test:unit

      - name: Component and journey tests (App, Capture, WORLD)
        run: npm run test:components

      - name: Bundle JS for Android and iOS
        run: npm run bundle:check

  dependency-health:
    name: Dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Dependencies match the Expo SDK
        run: npx expo install --check

      - name: expo-doctor (informational)
        continue-on-error: true
        run: npx expo-doctor@latest

      - name: No critical vulnerabilities
        run: npm audit --audit-level=critical
